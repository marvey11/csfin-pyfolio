[project]
name = "csfin-pyfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.uv.workspace]
members = ["apps/*", "libs/*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort (import order)
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations (enforces explicit type annotations everywhere)
    "PYI",    # flake8-pyi (type stub rules)
    "TCH",    # flake8-type-checking (moves type-only imports into TYPE_CHECKING blocks)
    "FA",     # flake8-future-annotations (enforces `from __future__ import annotations`)
    "RUF",    # Ruff-specific rules (includes type-check optimizations)
]

# Strict annotation configuration
[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = false
suppress-dummy-args = false
suppress-none-returning = false # Requires explicit -> None return types

[tool.pytest.ini_options]
testpaths = [
    "apps",
    "libs",
]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
# Add root and members to pythonpath so local packages import seamlessly during tests
pythonpath = [
    "libs/config/src",
    "libs/core/src",
    "apps/stock-worker/src",
    "apps/pyfolio/src"
]
