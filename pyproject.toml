[project]
name = "csfin-pyfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.uv.workspace]
members = ["apps/*", "libs/*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort (import order)
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations (enforces explicit type annotations everywhere)
    "PYI",    # flake8-pyi (type stub rules)
    "TCH",    # flake8-type-checking (moves type-only imports into TYPE_CHECKING blocks)
    "FA",     # flake8-future-annotations (enforces `from __future__ import annotations`)
    "RUF",    # Ruff-specific rules (includes type-check optimizations)
]
fixable = ["ALL"]
# S = flake8-bandit (Security checks)
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
# Allow 'assert' in tests (flake8-bandit rule S101)
"tests/**/*.py" = ["S101"]
"**/tests/**/*.py" = ["S101"]

[tool.ruff.format]
# Use "double" or "single" quotes based on your preference
quote-style = "double"

# Ensures a trailing comma in multi-line lists/dicts (better for git diffs)
skip-magic-trailing-comma = false

# This handles the indent style (usually 4 spaces)
indent-style = "space"

# Strict annotation configuration
[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = false
suppress-dummy-args = false
suppress-none-returning = false # Requires explicit -> None return types

[tool.pytest.ini_options]
testpaths = [ "apps", "libs" ]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "--cov=apps --cov=libs --cov-report=term-missing --cov-report=xml --cov-report=html"

[tool.coverage.run]
branch = true
source = ["apps", "libs"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.paths]
source = [
    "libs/",
    "apps/",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
